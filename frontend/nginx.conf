# Preserva o esquema original quando o proxy da plataforma termina o TLS.
# Sem X-Forwarded-Proto (Compose local), usa o esquema da conexão com o nginx.
# O backend usa esse valor para validar a origem do CSRF.
map $http_x_forwarded_proto $brocados_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Necessário para o upgrade WebSocket dos canais de pedido.
map $http_upgrade $brocados_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # O template é processado pelo entrypoint oficial do nginx.
    # PORT e API_HOSTPORT vêm do ambiente: Compose usa 80/api:8080;
    # o Render injeta a porta pública e o host privado da API.
    listen ${PORT};
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://*.sentry.io https://www.googletagmanager.com https://www.google-analytics.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://${API_HOSTPORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $brocados_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $brocados_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://${API_HOSTPORT}/healthz;
    }

    location = /readyz {
        proxy_pass http://${API_HOSTPORT}/readyz;
    }

    location / {
        # O nonce é gerado por requisição; o placeholder do index.html é
        # substituído antes de servir o HTML (inclusive no fallback da SPA).
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}
